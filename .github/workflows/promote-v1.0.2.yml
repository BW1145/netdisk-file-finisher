name: Publish tested v1.0.2
on:
  push:
    branches: ['release/v1.0.2']
permissions:
  contents: read
concurrency:
  group: publish-v1.0.2
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: '416309979'
      SOURCE_COMMIT: f4dee8f487813319548ffc648e4a6e717fc3a9d9
      EXPECTED_EXE_SHA256: 2886fcc5f89a978e2b7c8e3d64609edcb4c79e6bc2d0208079152249546761e5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f4dee8f487813319548ffc648e4a6e717fc3a9d9
          fetch-depth: 0
      - name: Download existing draft assets by release ID
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.draft -or $release.tag_name -ne 'v1.0.2' -or $release.assets.Count -ne 4) { throw 'Unexpected draft release.' }
          $tagCommit = (git rev-parse 'v1.0.2^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:SOURCE_COMMIT) { throw 'Tag must point to reviewed source.' }
          $expected = @{
            'BUILD_INFO.json' = '023db0f3d7a2064e612027bcc825fb5b19adc377f303880d7abd73e183e44da3'
            'NetdiskFinisher-v1.0.2-Windows-x64.zip' = '72f7f31163dfd830a12a2b5ce7bd507b7427f7e6d13c3a32dc420bab5e1ec3cd'
            'NetdiskFinisher.exe' = '2886fcc5f89a978e2b7c8e3d64609edcb4c79e6bc2d0208079152249546761e5'
            'SHA256SUMS.txt' = '6061b14af75dcb3e93b35471a7bb2ac351715aa225024035a5c06552d3d1ba67'
          }
          New-Item -ItemType Directory release | Out-Null
          foreach ($asset in $release.assets) {
            if (!$expected.ContainsKey($asset.name) -or $asset.state -ne 'uploaded' -or $asset.digest -ne "sha256:$($expected[$asset.name])") { throw 'Unexpected uploaded asset.' }
            # PowerShell 7.4+ preserves native byte streams during redirection.
            gh api "repos/$env:GH_REPO/releases/assets/$($asset.id)" -H 'Accept: application/octet-stream' > "release/$($asset.name)"
            if ($LASTEXITCODE -ne 0) { throw 'Could not download draft asset.' }
            $local = Get-Item -LiteralPath "release/$($asset.name)"
            if ($local.Length -ne $asset.size -or (Get-FileHash $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$asset.name]) { throw "Downloaded asset mismatch: $($asset.name)" }
          }
      - name: Verify ZIP, EXE, release metadata and checksum file
        shell: pwsh
        run: |
          Expand-Archive release/NetdiskFinisher-v1.0.2-Windows-x64.zip -DestinationPath verify
          $inside = Get-Content verify/BUILD_INFO.json -Encoding utf8 | ConvertFrom-Json
          $outside = Get-Content release/BUILD_INFO.json -Encoding utf8 | ConvertFrom-Json
          foreach ($info in @($inside, $outside)) {
            if ($info.version -ne 'v1.0.2' -or $info.commit -ne $env:SOURCE_COMMIT -or $info.exe_sha256 -ne $env:EXPECTED_EXE_SHA256) { throw 'Release metadata mismatch.' }
          }
          foreach ($path in @('verify/NetdiskFinisher.exe', 'release/NetdiskFinisher.exe')) {
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_EXE_SHA256) { throw 'Executable differs from tested build.' }
          }
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  ([^/\\]+)$') { throw 'Invalid checksum entry.' }
            $expected = $Matches[1]; $name = $Matches[2]
            if ((Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Release checksum mismatch: $name" }
          }
          $task = Start-Process ./verify/NetdiskFinisher.exe -ArgumentList '--smoke-test smoke.json' -PassThru -Wait -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw 'Downloaded packaged GUI check failed.' }
          $report = Get-Content smoke.json -Encoding utf8 | ConvertFrom-Json
          if (!$report.widgets_ready) { throw 'GUI widgets are unavailable.' }
      - name: Publish verified draft and confirm latest release
        shell: pwsh
        run: |
          gh api --method PATCH "repos/$env:GH_REPO/releases/$env:RELEASE_ID" -F draft=false -f make_latest=true > published.json
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $release = Get-Content published.json -Encoding utf8 | ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or !$release.published_at -or $release.tag_name -ne 'v1.0.2') { throw 'Release is not publicly published.' }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.id -ne [long]$env:RELEASE_ID) { throw 'Latest release does not match published release.' }
          Get-Content published.json -Encoding utf8
