name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -X utf8 -m unittest -v test_finisher
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Packaged GUI check
        shell: pwsh
        run: |
          $task = Start-Process ./dist/NetdiskFinisher.exe -ArgumentList '--smoke-test smoke.json' -PassThru -Wait -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw 'GUI check failed.' }
          $report = Get-Content smoke.json -Encoding utf8 | ConvertFrom-Json
          if (!$report.widgets_ready) { throw 'GUI widgets are unavailable.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NetdiskFinisher-Windows-x64
          path: dist/NetdiskFinisher.exe
