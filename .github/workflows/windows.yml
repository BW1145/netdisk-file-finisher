name: Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -X utf8 -m unittest -v test_finisher
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Packaged GUI check
        shell: pwsh
        run: |
          $task = Start-Process ./dist/NetdiskFinisher.exe -ArgumentList '--smoke-test smoke.json' -PassThru -Wait -WindowStyle Hidden
          if ($task.ExitCode -ne 0) { throw 'GUI check failed.' }
          $report = Get-Content smoke.json -Encoding utf8 | ConvertFrom-Json
          if (!$report.widgets_ready) { throw 'GUI widgets are unavailable.' }
      - name: Package and checksums
        shell: pwsh
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          $version = if ($env:BUILD_REF_TYPE -eq 'tag') { $env:BUILD_REF_NAME } else { 'dev-' + $env:BUILD_COMMIT.Substring(0, 12) }
          ./package-release.ps1 -Version $version -Commit $env:BUILD_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NetdiskFinisher-Windows-x64
          path: dist/release/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          gh run download $env:BUILD_RUN_ID --name NetdiskFinisher-Windows-x64 --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested build.' }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "网盘文件收尾 $env:RELEASE_TAG" --notes-from-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
